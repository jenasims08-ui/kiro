name: Daily BIM News Update

on:
  schedule:
    # 每天北京时间早上8点运行 (UTC 0:00)
    - cron: '0 0 * * *'
  workflow_dispatch: # 手动触发

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci
        working-directory: scripts

      - name: Fetch and generate daily news
        run: node scripts/fetch-news.js
        env:
          # 如果使用搜索API，在此配置密钥
          # SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      - name: Update data index
        run: node scripts/update-index.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/data/
          DATE=$(date +%Y-%m-%d)
          git diff --cached --quiet || git commit -m "📰 Daily update: ${DATE}"
          git push

  deploy:
    needs: fetch-news
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
