<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Daily - 建筑科技与BIM资讯每日汇总</title>
    <meta name="description" content="每日精选建筑科技、BIM、智慧建造、数字孪生等领域最新资讯">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --primary: #1a73e8;
    --primary-light: #e8f0fe;
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #e0e0e0;
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.1);
    --radius: 12px;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
.site-header {
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    padding: 24px 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
}
.site-title {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.site-title .icon { font-size: 32px; }
.site-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.tag-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tag-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.tag-btn:hover { border-color: var(--primary); color: var(--primary); }
.tag-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.news-feed { padding: 24px 0; }
.day-section { margin-bottom: 32px; }
.day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary);
}
.day-date { font-size: 18px; font-weight: 600; }
.day-count {
    font-size: 12px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 500;
}
.news-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
}
.news-card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--primary);
    transform: translateY(-1px);
}
.news-title { font-size: 16px; font-weight: 600; line-height: 1.5; }
.news-card:hover .news-title { color: var(--primary); }
.news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
}
.news-source { font-size: 12px; color: var(--text-secondary); }
.news-source::before { content: "📰 "; font-size: 11px; }
.news-time { font-size: 12px; color: var(--text-secondary); }
.news-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.news-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
}
.news-tag[data-tag="BIM"] { background: #e8f0fe; color: #1a73e8; }
.news-tag[data-tag="数字孪生"] { background: #f3e5f5; color: #9c27b0; }
.news-tag[data-tag="智慧建造"] { background: #e0f2f1; color: #00897b; }
.news-tag[data-tag="AI"] { background: #fce4ec; color: #e91e63; }
.news-tag[data-tag="政策"] { background: #fff3e0; color: #ff6f00; }
.news-tag[data-tag="软件"] { background: #e8f5e9; color: #43a047; }
.news-summary {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 15px;
}
.site-footer {
    text-align: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
}
.footer-note { margin-top: 4px; font-size: 12px; opacity: 0.7; }
@media (max-width: 600px) {
    .site-title { font-size: 22px; }
    .site-title .icon { font-size: 26px; }
    .news-card { padding: 14px 16px; }
    .news-title { font-size: 15px; }
    .tag-btn { padding: 5px 12px; font-size: 12px; }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">
                    <span class="icon">🏗️</span> BIM Daily
                </h1>
                <p class="site-subtitle">建筑科技与BIM资讯每日汇总</p>
            </div>
            <nav class="tag-filter" id="tagFilter">
                <button class="tag-btn active" data-tag="all">全部</button>
                <button class="tag-btn" data-tag="BIM">BIM</button>
                <button class="tag-btn" data-tag="数字孪生">数字孪生</button>
                <button class="tag-btn" data-tag="智慧建造">智慧建造</button>
                <button class="tag-btn" data-tag="AI">AI</button>
                <button class="tag-btn" data-tag="政策">政策</button>
                <button class="tag-btn" data-tag="软件">软件</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="newsFeed" class="news-feed"></div>
        <div id="noData" class="no-data" style="display:none;">
            <p>暂无该分类的资讯</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BIM Daily &copy; 2025 | 每日自动汇总建筑科技领域最新资讯</p>
            <p class="footer-note">数据来源于公开网络，仅供学习参考</p>
        </div>
    </footer>

    <script>
    const DATA = [
      {
        "date": "2025-05-22",
        "articles": [
          {"title":"Autodesk发布Revit 2026：AI驱动的设计建议功能成最大亮点","url":"https://aps.autodesk.com/blog/revit-2026","source":"Autodesk官方博客","summary":"Autodesk正式发布Revit 2026版本，新增AI驱动的设计建议、实时协作增强以及更强大的参数化建模工具，为建筑师和工程师提供更高效的BIM工作流。","tags":["BIM","软件","AI"],"time":"09:30"},
          {"title":"住建部发布《关于加快推进BIM技术在工程建设全生命周期应用的指导意见》","url":"https://www.mohurd.gov.cn/","source":"住房和城乡建设部","summary":"住建部发文要求2026年底前，大型公共建筑项目全面采用BIM技术，鼓励各地建立BIM审查平台，推动建筑业数字化转型。","tags":["BIM","政策"],"time":"10:15"},
          {"title":"深圳前海数字孪生城市平台正式上线运营","url":"https://www.sz.gov.cn/","source":"深圳特区报","summary":"深圳前海数字孪生城市管理平台正式投入运营，整合城市BIM模型、IoT传感器数据和AI分析能力，实现城市运行状态实时监测与智能决策支持。","tags":["数字孪生","智慧建造"],"time":"11:00"},
          {"title":"Bentley Systems收购建筑AI初创公司，加速智能设计布局","url":"https://www.bentley.com/","source":"Engineering News","summary":"Bentley Systems宣布收购一家专注于建筑生成式AI的初创公司，计划将AI能力整合进iTwin平台，提升基础设施数字孪生的智能化水平。","tags":["AI","软件","数字孪生"],"time":"13:20"},
          {"title":"中建三局采用无人机+BIM技术完成超高层建筑竣工测量","url":"https://www.cscec.com/","source":"建筑技术杂志","summary":"中建三局在武汉某超高层项目中首次采用无人机点云扫描结合BIM模型进行竣工验收测量，精度达到毫米级，效率提升80%。","tags":["BIM","智慧建造"],"time":"14:45"},
          {"title":"开源BIM工具BlenderBIM 0.8发布，支持IFC 4.3标准","url":"https://blenderbim.org/","source":"GitHub Release","summary":"开源BIM插件BlenderBIM发布0.8版本，全面支持IFC 4.3标准，新增基础设施建模模块，为中小企业提供零成本BIM解决方案。","tags":["BIM","软件"],"time":"16:00"},
          {"title":"ChatGPT与Grasshopper集成插件发布，支持自然语言生成参数化模型","url":"https://www.food4rhino.com/","source":"参数化设计论坛","summary":"开发者社区发布了一款将ChatGPT与Grasshopper集成的插件，设计师可通过自然语言描述生成参数化建筑模型，大幅降低编程门槛。","tags":["AI","BIM","软件"],"time":"17:30"}
        ]
      },
      {
        "date": "2025-05-21",
        "articles": [
          {"title":"广联达发布2025年Q1财报：BIM+AI业务收入同比增长45%","url":"https://www.glodon.com/","source":"证券时报","summary":"广联达2025年一季度财报显示，BIM与AI融合业务表现强劲，数字施工管理平台用户数突破10万，海外市场拓展顺利。","tags":["BIM","AI"],"time":"08:30"},
          {"title":"新加坡BCA发布建筑业AI应用白皮书","url":"https://www.bca.gov.sg/","source":"BCA Singapore","summary":"新加坡建设局(BCA)发布建筑业AI应用白皮书，概述AI在设计优化、施工安全监测、能耗预测等领域的最佳实践案例。","tags":["AI","政策"],"time":"10:00"},
          {"title":"腾讯云发布智慧建筑解决方案，集成BIM+IoT+AI三位一体","url":"https://cloud.tencent.com/","source":"腾讯云官方","summary":"腾讯云推出新一代智慧建筑解决方案，将BIM模型、物联网传感和AI算法深度融合，支持建筑全生命周期的智能化管理。","tags":["智慧建造","AI","数字孪生"],"time":"11:30"},
          {"title":"ISO 19650系列标准中文版正式出版发行","url":"https://www.iso.org/standard/68078.html","source":"中国标准出版社","summary":"BIM国际标准ISO 19650系列中文版正式出版，涵盖信息管理的组织与数字化框架，为国内BIM实施提供标准化指引。","tags":["BIM","政策"],"time":"14:00"},
          {"title":"Unity推出建筑可视化实时渲染引擎AEC Pro版","url":"https://unity.com/solutions/architecture-engineering-construction","source":"Unity Blog","summary":"Unity为建筑行业推出专业版实时渲染引擎，支持直接导入Revit和IFC模型，提供影视级实时可视化和VR沉浸式体验。","tags":["软件","BIM"],"time":"15:45"}
        ]
      }
    ];

    let currentTag = 'all';
    const newsFeed = document.getElementById('newsFeed');
    const tagFilter = document.getElementById('tagFilter');
    const noData = document.getElementById('noData');

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        const diffDays = Math.floor((today - date) / (1000*60*60*24));
        const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let label = `${month}月${day}日 ${weekdays[date.getDay()]}`;
        if (diffDays === 0) label = '今天 · ' + label;
        else if (diffDays === 1) label = '昨天 · ' + label;
        return label;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderNews(filterTag) {
        newsFeed.innerHTML = '';
        let hasContent = false;

        for (const day of DATA) {
            let articles = day.articles;
            if (filterTag && filterTag !== 'all') {
                articles = articles.filter(a => a.tags.includes(filterTag));
            }
            if (articles.length === 0) continue;
            hasContent = true;

            const section = document.createElement('div');
            section.className = 'day-section';
            section.innerHTML = `<div class="day-header"><span class="day-date">${formatDate(day.date)}</span><span class="day-count">${articles.length} 条资讯</span></div>`;

            for (const article of articles) {
                const card = document.createElement('a');
                card.className = 'news-card';
                card.href = article.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                const tagsHtml = article.tags.map(t => `<span class="news-tag" data-tag="${t}">${t}</span>`).join('');
                card.innerHTML = `
                    <h3 class="news-title">${escapeHtml(article.title)}</h3>
                    <div class="news-meta">
                        <span class="news-source">${escapeHtml(article.source)}</span>
                        <span class="news-time">${article.time}</span>
                        <div class="news-tags">${tagsHtml}</div>
                    </div>
                    <p class="news-summary">${escapeHtml(article.summary)}</p>
                `;
                section.appendChild(card);
            }
            newsFeed.appendChild(section);
        }

        noData.style.display = hasContent ? 'none' : 'block';
    }

    tagFilter.addEventListener('click', function(e) {
        if (!e.target.classList.contains('tag-btn')) return;
        tagFilter.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTag = e.target.dataset.tag;
        renderNews(currentTag);
    });

    renderNews(currentTag);
    </script>
</body>
</html>
