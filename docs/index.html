<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Daily - 建筑科技与BIM资讯每日汇总</title>
    <meta name="description" content="每日精选建筑科技、BIM、智慧建造、数字孪生等领域最新资讯">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --primary: #1a73e8;
    --primary-light: #e8f0fe;
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #e0e0e0;
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.1);
    --radius: 12px;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
.site-header {
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    padding: 24px 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
}
.site-title {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.site-title .icon { font-size: 32px; }
.site-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.tag-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tag-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.tag-btn:hover { border-color: var(--primary); color: var(--primary); }
.tag-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.news-feed { padding: 24px 0; }
.day-section { margin-bottom: 32px; }
.day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary);
}
.day-date { font-size: 18px; font-weight: 600; }
.day-count {
    font-size: 12px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 500;
}
.news-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
}
.news-card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--primary);
    transform: translateY(-1px);
}
.news-title { font-size: 16px; font-weight: 600; line-height: 1.5; }
.news-card:hover .news-title { color: var(--primary); }
.news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
}
.news-source { font-size: 12px; color: var(--text-secondary); }
.news-source::before { content: "📰 "; font-size: 11px; }
.news-time { font-size: 12px; color: var(--text-secondary); }
.news-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.news-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
}
.news-tag[data-tag="BIM"] { background: #e8f0fe; color: #1a73e8; }
.news-tag[data-tag="数字孪生"] { background: #f3e5f5; color: #9c27b0; }
.news-tag[data-tag="智慧建造"] { background: #e0f2f1; color: #00897b; }
.news-tag[data-tag="AI"] { background: #fce4ec; color: #e91e63; }
.news-tag[data-tag="政策"] { background: #fff3e0; color: #ff6f00; }
.news-tag[data-tag="软件"] { background: #e8f5e9; color: #43a047; }
.news-summary {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 15px;
}
.site-footer {
    text-align: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
}
.footer-note { margin-top: 4px; font-size: 12px; opacity: 0.7; }
@media (max-width: 600px) {
    .site-title { font-size: 22px; }
    .site-title .icon { font-size: 26px; }
    .news-card { padding: 14px 16px; }
    .news-title { font-size: 15px; }
    .tag-btn { padding: 5px 12px; font-size: 12px; }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">
                    <span class="icon">🏗️</span> BIM Daily
                </h1>
                <p class="site-subtitle">建筑科技与BIM资讯每日汇总</p>
            </div>
            <nav class="tag-filter" id="tagFilter">
                <button class="tag-btn active" data-tag="all">全部</button>
                <button class="tag-btn" data-tag="BIM">BIM</button>
                <button class="tag-btn" data-tag="数字孪生">数字孪生</button>
                <button class="tag-btn" data-tag="智慧建造">智慧建造</button>
                <button class="tag-btn" data-tag="AI">AI</button>
                <button class="tag-btn" data-tag="政策">政策</button>
                <button class="tag-btn" data-tag="软件">软件</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="newsFeed" class="news-feed"></div>
        <div id="noData" class="no-data" style="display:none;">
            <p>暂无该分类的资讯</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BIM Daily &copy; 2025 | 每日自动汇总建筑科技领域最新资讯</p>
            <p class="footer-note">数据来源于公开网络，仅供学习参考</p>
        </div>
    </footer>

    <script>
    const DATA = [
      {
        "date": "2025-05-22",
        "articles": [
          {"title":"Autodesk发布Revit 2026.1：Dynamo 3.5增强计算设计工作流","url":"https://www.autodesk.com/blogs/aec/2025/05/22/whats-new-in-revit-2026-1/","source":"Autodesk AEC Blog","summary":"Revit 2026.1正式发布，带来Dynamo 3.5增强计算设计工作流、简化模型导航、加速从设计到分析的过渡等一系列针对性改进。","tags":["BIM","软件"],"time":"09:30"},
          {"title":"Bentley Systems与EARTHBRAIN合作打造AI驱动的智慧施工数字孪生","url":"https://windowsforum.com/threads/bentley-and-earthbrain-unite-for-ai-powered-digital-twin-in-smart-construction.388536/","source":"Windows Forum","summary":"Bentley Systems与日本EARTHBRAIN达成合作，将设计、预施工规划、土方工程和资产运营整合到单一AI数字孪生生态系统中。","tags":["AI","软件","数字孪生"],"time":"10:15"},
          {"title":"数字孪生在交通基础设施智能建造中的应用与挑战","url":"https://transport.chd.edu.cn/article/doi/10.19818/j.cnki.1671-1637.2025.03.003","source":"交通运输工程学报","summary":"长安大学学报发表论文，系统综述数字孪生技术在交通基础设施智能建造中的应用现状、关键技术与未来挑战。","tags":["数字孪生","智慧建造"],"time":"11:00"},
          {"title":"Bentley Systems收购Talon Aerolytics和Pointivo，强化AI现实建模能力","url":"https://www.traffictechnologytoday.com/news/acquisitions-mergers/bentley-systems-acquires-talon-aerolytics-and-pointivo-technology.html","source":"Traffic Technology Today","summary":"Bentley Systems收购无人机数据分析公司Talon Aerolytics和Pointivo技术资产，增强基础设施数字孪生的AI现实建模能力。","tags":["AI","软件","数字孪生"],"time":"13:20"},
          {"title":"开源BIM工具Bonsai (原BlenderBIM) v0.8发布，支持Blender 4.2","url":"https://www.blendernation.com/2024/09/01/bonsai-previously-blenderbim-add-on-v0-8-0-adds-blender-4-2-and-much-more/","source":"BlenderNation","summary":"Bonsai（原BlenderBIM插件）发布v0.8.0版本，新增超过一千项功能和修复，提供原生IFC和OpenBIM创作能力，支持Blender 4.2。","tags":["BIM","软件"],"time":"16:00"},
          {"title":"IFC 4.3标准正式发布：buildingSMART推动基础设施BIM标准化","url":"https://www.buildingsmart.org/standards/bsi-standards/industry-foundation-classes/","source":"buildingSMART","summary":"buildingSMART发布IFC 4.3.2.0最终版本（ISO 16739-1:2024），将BIM数据交换标准扩展到道路、铁路、桥梁等基础设施领域。","tags":["BIM","政策"],"time":"16:30"},
          {"title":"YTGH-AIgrasshopper：AI辅助参数化设计Grasshopper工具集发布","url":"https://www.food4rhino.com/en/app/ytgh-aigrasshopper?lang=en","source":"Food4Rhino","summary":"YTGH发布综合性Rhino Grasshopper工具集，专注AI辅助参数化设计、CAD互操作性和点云建模，降低参数化设计门槛。","tags":["AI","BIM","软件"],"time":"17:30"}
        ]
      },
      {
        "date": "2025-05-21",
        "articles": [
          {"title":"Autodesk官方博客：Revit 2026带来加速图形和25周年增强功能","url":"https://www.autodesk.com/blogs/aec/2025/04/02/whats-new-in-revit-2026/","source":"Autodesk AEC Blog","summary":"Revit迎来25周年，2026版本带来加速图形技术预览、ReCap Pro网格插件、增强的场地和地形工具等重要改进。","tags":["BIM","软件"],"time":"08:30"},
          {"title":"Bentley Systems开启Year in Infrastructure 2025：AI将变革基础设施","url":"https://www.bentley.com/news/ai-is-poised-to-transform-infrastructure-bentley-systems-opens-the-year-in-infrastructure-2025/","source":"Bentley Systems","summary":"Bentley Systems在Year in Infrastructure 2025大会上宣布AI将深刻变革基础设施行业，展示多项AI与数字孪生融合成果。","tags":["AI","数字孪生"],"time":"10:00"},
          {"title":"ISO 19650-2: BIM信息管理国际标准——资产交付阶段","url":"https://www.iso.org/standard/68080.html","source":"ISO官方","summary":"ISO正式发布19650-2标准，规定建筑信息模型在资产交付阶段的信息管理要求，为全球BIM协作提供标准化框架。","tags":["BIM","政策"],"time":"14:00"},
          {"title":"Unity建筑可视化解决方案：实时3D赋能AEC行业","url":"https://unity.com/solutions/architecture-engineering-construction","source":"Unity官方","summary":"Unity为建筑、工程和施工行业提供实时3D解决方案，支持沉浸式VR/AR体验、设计评审和施工模拟，加速BIM可视化。","tags":["软件","BIM"],"time":"15:45"},
          {"title":"用ChatGPT在Grasshopper中实验参数化设计：零基础也能上手","url":"https://discourse.mcneel.com/t/experimenting-using-chatgpt-4o-with-canvas-in-grasshopper/192475","source":"McNeel论坛","summary":"McNeel社区用户分享使用ChatGPT 4o辅助Grasshopper参数化设计的实验，展示如何用自然语言降低可视化编程门槛。","tags":["AI","BIM","软件"],"time":"16:30"}
        ]
      }
    ];

    let currentTag = 'all';
    const newsFeed = document.getElementById('newsFeed');
    const tagFilter = document.getElementById('tagFilter');
    const noData = document.getElementById('noData');

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        const diffDays = Math.floor((today - date) / (1000*60*60*24));
        const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let label = `${month}月${day}日 ${weekdays[date.getDay()]}`;
        if (diffDays === 0) label = '今天 · ' + label;
        else if (diffDays === 1) label = '昨天 · ' + label;
        return label;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderNews(filterTag) {
        newsFeed.innerHTML = '';
        let hasContent = false;

        for (const day of DATA) {
            let articles = day.articles;
            if (filterTag && filterTag !== 'all') {
                articles = articles.filter(a => a.tags.includes(filterTag));
            }
            if (articles.length === 0) continue;
            hasContent = true;

            const section = document.createElement('div');
            section.className = 'day-section';
            section.innerHTML = `<div class="day-header"><span class="day-date">${formatDate(day.date)}</span><span class="day-count">${articles.length} 条资讯</span></div>`;

            for (const article of articles) {
                const card = document.createElement('a');
                card.className = 'news-card';
                card.href = article.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                const tagsHtml = article.tags.map(t => `<span class="news-tag" data-tag="${t}">${t}</span>`).join('');
                card.innerHTML = `
                    <h3 class="news-title">${escapeHtml(article.title)}</h3>
                    <div class="news-meta">
                        <span class="news-source">${escapeHtml(article.source)}</span>
                        <span class="news-time">${article.time}</span>
                        <div class="news-tags">${tagsHtml}</div>
                    </div>
                    <p class="news-summary">${escapeHtml(article.summary)}</p>
                `;
                section.appendChild(card);
            }
            newsFeed.appendChild(section);
        }

        noData.style.display = hasContent ? 'none' : 'block';
    }

    tagFilter.addEventListener('click', function(e) {
        if (!e.target.classList.contains('tag-btn')) return;
        tagFilter.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTag = e.target.dataset.tag;
        renderNews(currentTag);
    });

    renderNews(currentTag);
    </script>
</body>
</html>
