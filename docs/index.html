<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Daily - 建筑科技与BIM资讯每日汇总</title>
    <meta name="description" content="每日精选建筑科技、BIM、智慧建造、数字孪生等领域最新资讯">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --primary: #1a73e8;
    --primary-light: #e8f0fe;
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #e0e0e0;
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.1);
    --radius: 12px;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
.site-header {
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    padding: 24px 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
}
.site-title {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.site-title .icon { font-size: 32px; }
.site-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.tag-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tag-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.tag-btn:hover { border-color: var(--primary); color: var(--primary); }
.tag-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.news-feed { padding: 24px 0; }
.day-section { margin-bottom: 32px; }
.day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary);
}
.day-date { font-size: 18px; font-weight: 600; }
.day-count {
    font-size: 12px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 500;
}
.news-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
}
.news-card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--primary);
    transform: translateY(-1px);
}
.news-title { font-size: 16px; font-weight: 600; line-height: 1.5; }
.news-card:hover .news-title { color: var(--primary); }
.news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
}
.news-source { font-size: 12px; color: var(--text-secondary); }
.news-source::before { content: "📰 "; font-size: 11px; }
.news-time { font-size: 12px; color: var(--text-secondary); }
.news-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.news-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
}
.news-tag[data-tag="BIM"] { background: #e8f0fe; color: #1a73e8; }
.news-tag[data-tag="数字孪生"] { background: #f3e5f5; color: #9c27b0; }
.news-tag[data-tag="智慧建造"] { background: #e0f2f1; color: #00897b; }
.news-tag[data-tag="AI"] { background: #fce4ec; color: #e91e63; }
.news-tag[data-tag="政策"] { background: #fff3e0; color: #ff6f00; }
.news-tag[data-tag="软件"] { background: #e8f5e9; color: #43a047; }
.news-summary {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.loading {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
}
.spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 15px;
}
.last-updated {
    text-align: center;
    padding: 8px;
    font-size: 12px;
    color: var(--text-secondary);
    opacity: 0.7;
}
.site-footer {
    text-align: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
}
.footer-note { margin-top: 4px; font-size: 12px; opacity: 0.7; }
@media (max-width: 600px) {
    .site-title { font-size: 22px; }
    .site-title .icon { font-size: 26px; }
    .news-card { padding: 14px 16px; }
    .news-title { font-size: 15px; }
    .tag-btn { padding: 5px 12px; font-size: 12px; }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">
                    <span class="icon">🏗️</span> BIM Daily
                </h1>
                <p class="site-subtitle">建筑科技与BIM资讯每日汇总 · 每天自动更新</p>
            </div>
            <nav class="tag-filter" id="tagFilter">
                <button class="tag-btn active" data-tag="all">全部</button>
                <button class="tag-btn" data-tag="BIM">BIM</button>
                <button class="tag-btn" data-tag="数字孪生">数字孪生</button>
                <button class="tag-btn" data-tag="智慧建造">智慧建造</button>
                <button class="tag-btn" data-tag="AI">AI</button>
                <button class="tag-btn" data-tag="政策">政策</button>
                <button class="tag-btn" data-tag="软件">软件</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="lastUpdated" class="last-updated"></div>
        <div id="newsFeed" class="news-feed"></div>
        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>正在加载最新资讯...</p>
        </div>
        <div id="noData" class="no-data" style="display:none;">
            <p>暂无该分类的资讯</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BIM Daily &copy; 2026 | 每日自动汇总建筑科技领域最新资讯</p>
            <p class="footer-note">数据来源于 Google News RSS，每天北京时间8:00自动更新</p>
        </div>
    </footer>

    <script>
    (function() {
        'use strict';

        const newsFeed = document.getElementById('newsFeed');
        const loading = document.getElementById('loading');
        const noData = document.getElementById('noData');
        const tagFilter = document.getElementById('tagFilter');
        const lastUpdatedEl = document.getElementById('lastUpdated');

        let allData = [];
        let currentTag = 'all';

        // 加载数据：先尝试从 data/ 目录加载JSON，失败则用内嵌备用数据
        async function loadData() {
            try {
                // 尝试加载索引文件
                const indexResp = await fetch('data/index.json');
                if (!indexResp.ok) throw new Error('No index');
                const index = await indexResp.json();

                if (index.lastUpdated) {
                    const d = new Date(index.lastUpdated);
                    lastUpdatedEl.textContent = `最后更新: ${d.toLocaleDateString('zh-CN')} ${d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'})}`;
                }

                // 加载每天的数据（最多7天）
                const results = [];
                const datesToLoad = (index.dates || []).slice(0, 7);

                for (const date of datesToLoad) {
                    try {
                        const resp = await fetch(`data/${date}.json`);
                        if (resp.ok) {
                            const data = await resp.json();
                            results.push(data);
                        }
                    } catch (e) { /* skip */ }
                }

                if (results.length > 0) return results;
                throw new Error('No data files loaded');
            } catch (e) {
                // 如果外部数据加载失败，使用备用内嵌数据
                console.log('Using fallback data:', e.message);
                return getFallbackData();
            }
        }

        // 备用内嵌数据（首次部署或数据还未生成时使用）
        function getFallbackData() {
            return [
                {
                    "date": "2026-05-26",
                    "articles": [
                        {"title":"请手动触发GitHub Actions更新资讯","url":"#","source":"系统提示","summary":"首次部署后，请到仓库 Actions 页面手动运行一次 Daily BIM News Update 工作流，即可自动抓取最新资讯。之后每天会自动更新。","tags":["BIM"],"time":"08:00"}
                    ]
                }
            ];
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const today = new Date(); today.setHours(0,0,0,0);
            const diffDays = Math.floor((today - date) / (1000*60*60*24));
            const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
            const month = date.getMonth() + 1;
            const day = date.getDate();
            let label = `${month}月${day}日 ${weekdays[date.getDay()]}`;
            if (diffDays === 0) label = '今天 · ' + label;
            else if (diffDays === 1) label = '昨天 · ' + label;
            return label;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function renderNews(data, filterTag) {
            newsFeed.innerHTML = '';
            let hasContent = false;

            for (const day of data) {
                let articles = day.articles;
                if (filterTag && filterTag !== 'all') {
                    articles = articles.filter(a => a.tags && a.tags.includes(filterTag));
                }
                if (articles.length === 0) continue;
                hasContent = true;

                const section = document.createElement('div');
                section.className = 'day-section';
                section.innerHTML = `<div class="day-header"><span class="day-date">${formatDate(day.date)}</span><span class="day-count">${articles.length} 条资讯</span></div>`;

                for (const article of articles) {
                    const card = document.createElement('a');
                    card.className = 'news-card';
                    card.href = article.url;
                    card.target = '_blank';
                    card.rel = 'noopener noreferrer';
                    const tagsHtml = (article.tags || []).map(t => `<span class="news-tag" data-tag="${t}">${t}</span>`).join('');
                    card.innerHTML = `
                        <h3 class="news-title">${escapeHtml(article.title)}</h3>
                        <div class="news-meta">
                            <span class="news-source">${escapeHtml(article.source)}</span>
                            <span class="news-time">${article.time || ''}</span>
                            <div class="news-tags">${tagsHtml}</div>
                        </div>
                        ${article.summary ? `<p class="news-summary">${escapeHtml(article.summary)}</p>` : ''}
                    `;
                    section.appendChild(card);
                }
                newsFeed.appendChild(section);
            }

            noData.style.display = hasContent ? 'none' : 'block';
        }

        tagFilter.addEventListener('click', function(e) {
            if (!e.target.classList.contains('tag-btn')) return;
            tagFilter.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
            e.target.classList.add('active');
            currentTag = e.target.dataset.tag;
            renderNews(allData, currentTag);
        });

        // 初始化
        async function init() {
            try {
                allData = await loadData();
                loading.style.display = 'none';
                renderNews(allData, currentTag);
            } catch (err) {
                loading.innerHTML = '<p>加载失败，请刷新重试</p>';
                console.error('加载数据失败:', err);
            }
        }

        init();
    })();
    </script>
</body>
</html>
