<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BIM Daily - 建筑科技与BIM资讯每日汇总</title>
    <meta name="description" content="每日精选建筑科技、BIM、智慧建造、数字孪生等领域最新资讯">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
    <style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
    --primary: #1a73e8;
    --primary-light: #e8f0fe;
    --bg: #f8f9fa;
    --surface: #ffffff;
    --text: #202124;
    --text-secondary: #5f6368;
    --border: #e0e0e0;
    --shadow-hover: 0 4px 12px rgba(0,0,0,0.1);
    --radius: 12px;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
}
.container { max-width: 900px; margin: 0 auto; padding: 0 20px; }
.site-header {
    background: rgba(255,255,255,0.95);
    border-bottom: 1px solid var(--border);
    padding: 24px 0 16px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(8px);
}
.site-title {
    font-size: 28px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}
.site-title .icon { font-size: 32px; }
.site-subtitle { color: var(--text-secondary); font-size: 14px; margin-top: 4px; }
.tag-filter { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
.tag-btn {
    padding: 6px 14px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: var(--surface);
    color: var(--text-secondary);
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
    font-family: inherit;
}
.tag-btn:hover { border-color: var(--primary); color: var(--primary); }
.tag-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
.news-feed { padding: 24px 0; }
.day-section { margin-bottom: 32px; }
.day-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 8px;
    border-bottom: 2px solid var(--primary);
}
.day-date { font-size: 18px; font-weight: 600; }
.day-count {
    font-size: 12px;
    background: var(--primary-light);
    color: var(--primary);
    padding: 2px 10px;
    border-radius: 12px;
    font-weight: 500;
}
.news-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 20px;
    margin-bottom: 12px;
    transition: all 0.2s;
    cursor: pointer;
    text-decoration: none;
    display: block;
    color: inherit;
}
.news-card:hover {
    box-shadow: var(--shadow-hover);
    border-color: var(--primary);
    transform: translateY(-1px);
}
.news-title { font-size: 16px; font-weight: 600; line-height: 1.5; }
.news-card:hover .news-title { color: var(--primary); }
.news-meta {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 8px;
    flex-wrap: wrap;
}
.news-source { font-size: 12px; color: var(--text-secondary); }
.news-source::before { content: "📰 "; font-size: 11px; }
.news-time { font-size: 12px; color: var(--text-secondary); }
.news-tags { display: flex; gap: 6px; flex-wrap: wrap; }
.news-tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 500;
}
.news-tag[data-tag="BIM"] { background: #e8f0fe; color: #1a73e8; }
.news-tag[data-tag="数字孪生"] { background: #f3e5f5; color: #9c27b0; }
.news-tag[data-tag="智慧建造"] { background: #e0f2f1; color: #00897b; }
.news-tag[data-tag="AI"] { background: #fce4ec; color: #e91e63; }
.news-tag[data-tag="政策"] { background: #fff3e0; color: #ff6f00; }
.news-tag[data-tag="软件"] { background: #e8f5e9; color: #43a047; }
.news-summary {
    font-size: 14px;
    color: var(--text-secondary);
    margin-top: 8px;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}
.no-data {
    text-align: center;
    padding: 60px 20px;
    color: var(--text-secondary);
    font-size: 15px;
}
.site-footer {
    text-align: center;
    padding: 24px 0;
    border-top: 1px solid var(--border);
    color: var(--text-secondary);
    font-size: 13px;
}
.footer-note { margin-top: 4px; font-size: 12px; opacity: 0.7; }
@media (max-width: 600px) {
    .site-title { font-size: 22px; }
    .site-title .icon { font-size: 26px; }
    .news-card { padding: 14px 16px; }
    .news-title { font-size: 15px; }
    .tag-btn { padding: 5px 12px; font-size: 12px; }
}
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container">
            <div class="header-content">
                <h1 class="site-title">
                    <span class="icon">🏗️</span> BIM Daily
                </h1>
                <p class="site-subtitle">建筑科技与BIM资讯每日汇总</p>
            </div>
            <nav class="tag-filter" id="tagFilter">
                <button class="tag-btn active" data-tag="all">全部</button>
                <button class="tag-btn" data-tag="BIM">BIM</button>
                <button class="tag-btn" data-tag="数字孪生">数字孪生</button>
                <button class="tag-btn" data-tag="智慧建造">智慧建造</button>
                <button class="tag-btn" data-tag="AI">AI</button>
                <button class="tag-btn" data-tag="政策">政策</button>
                <button class="tag-btn" data-tag="软件">软件</button>
            </nav>
        </div>
    </header>

    <main class="container">
        <div id="newsFeed" class="news-feed"></div>
        <div id="noData" class="no-data" style="display:none;">
            <p>暂无该分类的资讯</p>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>BIM Daily &copy; 2025-2026 | 每日自动汇总建筑科技领域最新资讯</p>
            <p class="footer-note">数据来源于公开网络，仅供学习参考</p>
        </div>
    </footer>

    <script>
    const DATA = [
      {
        "date": "2026-05-22",
        "articles": [
          {"title":"AEC Magazine: Agentic BIM缺失的基础设施——自主设计的未来","url":"https://aecmag.com/ai/agentic-bims-missing-infrastructure/","source":"AEC Magazine","summary":"AEC Magazine深度分析Agentic BIM（代理式BIM）从建模到自动化执行的转变，探讨BIM平台如何管理委托权限而非仅仅管理几何体。","tags":["BIM","AI"],"time":"09:00"},
          {"title":"英国学者呼吁建立建筑行业AI使用的伦理治理框架","url":"https://www.pbctoday.co.uk/news/digital-construction-news/ethical-governance-artificial-intelligence-use-in-uk-aec-sector/162259/","source":"PBC Today","summary":"英国研究者发起新项目，旨在绘制英国AEC行业AI使用的伦理治理图谱，邀请从业者参与，推动负责任的AI应用标准制定。","tags":["AI","政策"],"time":"10:30"},
          {"title":"学者推动AI与数字孪生技术应用于结构安全系统","url":"https://guardian.ng/news/don-pushes-for-ai-digital-twins-in-future-structural-safety-systems/","source":"The Guardian Nigeria","summary":"研究者提出将数字孪生（建筑虚拟副本）用于全生命周期的结构安全监测，AI可以在故障发生前触发维护预警。","tags":["数字孪生","AI"],"time":"11:00"},
          {"title":"高精度零件修复技术助力更精确的数字孪生模型建立","url":"https://construction.einnews.com/pr_news/914060543/leveraging-high-precision-component-repair-to-enable-more-accurate-digital-twin-models","source":"EIN Construction News","summary":"全球数字孪生市场预计2026年达494.7亿美元。使用数字孪生的企业报告非计划停机减少65%，预测性维护成本节约79%。","tags":["数字孪生","智慧建造"],"time":"14:00"},
          {"title":"BIM Chapters：Revit 2027 MCP公开服务器技术预览——AI能力首次进入Revit","url":"https://bimchapters.blogspot.com/","source":"BIM Chapters","summary":"Autodesk本周宣布Revit 2027首次通过Autodesk Assistant引入AI能力，同时发布Revit MCP公开服务器技术预览，引发BIM工作流变革讨论。","tags":["BIM","AI","软件"],"time":"16:00"},
          {"title":"新华社：重庆「山城」智慧工地展示数字化与绿色建造融合","url":"http://www.news.cn/english/20260511/347887fc86454ca1a43f5fe718ba3615/c.html","source":"新华社","summary":"重庆梁平区无人机制造产业园智慧工地亮相，展示建筑施工中数字化、智能化和绿色低碳发展的融合应用。","tags":["智慧建造"],"time":"17:00"}
        ]
      },
      {
        "date": "2026-05-21",
        "articles": [
          {"title":"BIMcollab统一平台重大更新：CDE与模型协调整合为一","url":"https://helpcenter.bimcollab.com/en/articles/326485-release-notes","source":"BIMcollab","summary":"BIMcollab发布重大平台更新，将文档管理(CDE)和模型协调(MQA)统一为一体化平台，推出Basic、Advanced和Enterprise三个层级。","tags":["BIM","软件"],"time":"09:00"},
          {"title":"AEC Magazine 2026年5/6月刊：建筑施工新技术与代理式BIM工作流","url":"https://aecmag.com/technology/aec-magazine-may-june-2026/","source":"AEC Magazine","summary":"最新一期AEC Magazine深入探讨施工新技术、MEP设计自动化，以及代理式BIM工作流的障碍与机遇，预告NXT BLD 2026十周年大会。","tags":["BIM","AI"],"time":"10:00"},
          {"title":"ISO 19650标准2026年重大修订：BIM正在被「信息管理」取代？","url":"https://rebim.io/iso-19650-changes-2026/","source":"reBIM","summary":"ISO 19650第1/2/3部分草案修订于2026年发布公众咨询，这是BIM成为主流以来数字建造标准最重大的变化，术语和流程将统一为9步信息管理体系。","tags":["BIM","政策"],"time":"11:30"},
          {"title":"Trimble发布2026版Tekla软件：AI驱动BIM工程与施工生产力提升","url":"https://news.trimble.com/Trimble-Unveils-2026-Tekla-Software-Accelerating-BIM-Engineering-and-Construction-Productivity-Through-Streamlined-Workflows-and-AI","source":"Trimble","summary":"Trimble发布2026版Tekla BIM软件，为结构工程和钢构制造管理带来数据驱动工作流，通过AI连接设计与施工环节。","tags":["BIM","软件","AI"],"time":"13:00"},
          {"title":"Autodesk Revit 2027正式发布：首次引入AI Assistant与MCP技术","url":"https://www.autodesk.com/blogs/aec/2026/04/07/whats-new-in-revit-2027/","source":"Autodesk AEC Blog","summary":"Revit 2027将Autodesk AI引入建模环境，支持自然语言交互、自动生成文档步骤和触发建模操作，同时通过云端连接工作流。","tags":["BIM","软件","AI"],"time":"14:30"},
          {"title":"NXT BLD 2026大会预告：自主设计成为核心主题","url":"https://aecmag.com/nxt-bld/11-themes-for-nxt-bld-2026/","source":"AEC Magazine","summary":"NXT BLD 2026十周年大会将首次汇聚全球自主MEP和结构设计领域关键创新者，自主设计成为会议工程和施工主线的核心议题。","tags":["AI","BIM"],"time":"16:00"},
          {"title":"Virginia Tech开发「Mario」机器人与无人机系统用于工地监测","url":"https://roboticsandautomationnews.com/2026/03/17/robots-and-ai-are-tackling-some-of-the-biggest-challenges-in-construction/99811/","source":"Robotics & Automation News","summary":"Virginia Tech与Procon Consulting合作开发机器人+无人机+AI感知+计算机视觉协同团队，实现施工现场持续远程监控。","tags":["智慧建造","AI"],"time":"17:00"}
        ]
      }
    ];

    let currentTag = 'all';
    const newsFeed = document.getElementById('newsFeed');
    const tagFilter = document.getElementById('tagFilter');
    const noData = document.getElementById('noData');

    function formatDate(dateStr) {
        const date = new Date(dateStr + 'T00:00:00');
        const today = new Date(); today.setHours(0,0,0,0);
        const diffDays = Math.floor((today - date) / (1000*60*60*24));
        const weekdays = ['周日','周一','周二','周三','周四','周五','周六'];
        const month = date.getMonth() + 1;
        const day = date.getDate();
        let label = `${month}月${day}日 ${weekdays[date.getDay()]}`;
        if (diffDays === 0) label = '今天 · ' + label;
        else if (diffDays === 1) label = '昨天 · ' + label;
        return label;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderNews(filterTag) {
        newsFeed.innerHTML = '';
        let hasContent = false;

        for (const day of DATA) {
            let articles = day.articles;
            if (filterTag && filterTag !== 'all') {
                articles = articles.filter(a => a.tags.includes(filterTag));
            }
            if (articles.length === 0) continue;
            hasContent = true;

            const section = document.createElement('div');
            section.className = 'day-section';
            section.innerHTML = `<div class="day-header"><span class="day-date">${formatDate(day.date)}</span><span class="day-count">${articles.length} 条资讯</span></div>`;

            for (const article of articles) {
                const card = document.createElement('a');
                card.className = 'news-card';
                card.href = article.url;
                card.target = '_blank';
                card.rel = 'noopener noreferrer';
                const tagsHtml = article.tags.map(t => `<span class="news-tag" data-tag="${t}">${t}</span>`).join('');
                card.innerHTML = `
                    <h3 class="news-title">${escapeHtml(article.title)}</h3>
                    <div class="news-meta">
                        <span class="news-source">${escapeHtml(article.source)}</span>
                        <span class="news-time">${article.time}</span>
                        <div class="news-tags">${tagsHtml}</div>
                    </div>
                    <p class="news-summary">${escapeHtml(article.summary)}</p>
                `;
                section.appendChild(card);
            }
            newsFeed.appendChild(section);
        }

        noData.style.display = hasContent ? 'none' : 'block';
    }

    tagFilter.addEventListener('click', function(e) {
        if (!e.target.classList.contains('tag-btn')) return;
        tagFilter.querySelectorAll('.tag-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentTag = e.target.dataset.tag;
        renderNews(currentTag);
    });

    renderNews(currentTag);
    </script>
</body>
</html>
